name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Engine tests (unit + dummy-app integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: inline_forms

      # The dev Gemfile points at the validation_hints sibling checkout
      # (gem "validation_hints", path: "../validation_hints").
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/validation_hints
          path: validation_hints

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: inline_forms
          bundler-cache: true

      - name: Run tests
        working-directory: inline_forms
        run: bundle exec rake test

  audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: inline_forms

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/validation_hints
          path: validation_hints

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: inline_forms
          bundler-cache: true

      - name: Audit dependencies
        working-directory: inline_forms
        run: |
          gem install bundler-audit
          bundle-audit check --update
