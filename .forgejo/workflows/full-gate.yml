# The full release gate as a CI job: build all three gems, install them,
# generate the example app (which runs its own 150+ test suite as part of
# `inline_forms create`), then run Brakeman against the generated app.
#
# Brakeman is aimed at Rails *applications* and skips gem code, so it runs
# twice: on the generated MyApp (everything the installer writes), and on
# MyApp together with the engine's own controllers, helpers and views
# (.forgejo/brakeman-engine.sh; accepted warnings, with their reasons, in
# .forgejo/brakeman.ignore). bundler-audit for the engine runs in ci.yml.
#
# Heavy (~3-4 min: rails new + bundle + migrations + tests), so it runs on
# demand and weekly, not per push. Requires network access to rubygems.org
# from the runner (same as Papiamentu's bundle install).
#
# No Node: the official ruby image and plain git, as in ci.yml. The generated
# app's autoprefixer-rails needs a JavaScript runtime; ExecJS takes mini_racer,
# which `bundle install` installs because no group is excluded (it is in the
# app's production group).
name: Full gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17

jobs:
  full-gate:
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.10
    steps:
      - name: Check out inline_forms
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git init -q inline_forms
          cd inline_forms
          git -c http.extraHeader="Authorization: basic $auth" fetch -q --depth 1 "$SERVER/$REPO.git" "$SHA"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Check out validation_hints
        env:
          TOKEN: ${{ secrets.VALIDATION_HINTS }}
          SERVER: ${{ github.server_url }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git init -q validation_hints
          cd validation_hints
          git -c http.extraHeader="Authorization: basic $auth" fetch -q --depth 1 "$SERVER/ace/validation_hints.git" HEAD
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Build the four gems
        run: |
          cd validation_hints && gem build validation_hints.gemspec && cd ..
          cd inline_forms && gem build inline_forms.gemspec && gem build inline_forms_installer.gemspec
          cd inline_forms_schema_edit && gem build inline_forms_schema_edit.gemspec

      - name: Install built gems
        run: |
          gem install --no-document \
            validation_hints/validation_hints-*.gem \
            inline_forms/inline_forms-*.gem \
            inline_forms/inline_forms_installer-*.gem \
            inline_forms/inline_forms_schema_edit/inline_forms_schema_edit-*.gem

      # The installer git-inits the generated app and makes an initial commit
      # (installer_core.rb: `git add .` + `git commit`); a bare container has
      # no git identity and the commit — and with it the whole create — fails
      # ("unable to auto-detect email address", seen in run 3).
      - name: Git identity for the installer's initial commit
        run: |
          git config --global user.email "forgejo-ci@dev02.invalid"
          git config --global user.name "Forgejo CI"

      # The installer's example gate runs `bundle exec rails test` itself and
      # aborts (non-zero) on any failure — this step IS the release gate.
      # HOME keeps Rails/Bundler caches inside the workspace container.
      - name: Generate example app (runs its own test suite)
        run: |
          mkdir -p apps
          cd apps
          inline_forms create MyApp -d sqlite --example --no-rvm

      - name: Brakeman against the generated app
        run: |
          # The version brakeman.ignore was made with: its fingerprints can
          # change with another one. Raise both together.
          version=$(ruby -rjson -e 'puts JSON.load_file("inline_forms/.forgejo/brakeman.ignore")["brakeman_version"]')
          gem install brakeman -v "$version" --no-document
          cd apps/MyApp
          # Default check set is ENFORCING (baseline triaged 2026-07-06:
          # 0 warnings; the one ForceSSL finding was fixed in 8.1.36).
          brakeman "_${version}_" --no-pager
          # Pedantic full set stays informational: it includes checks that
          # can fire on perfectly reasonable future code.
          brakeman "_${version}_" --run-all-checks --no-pager || true

      # ENFORCING: a warning that is not in .forgejo/brakeman.ignore fails, and
      # so does an entry there that has no reason or no longer occurs.
      - name: Brakeman against the app together with the engine
        run: bash inline_forms/.forgejo/brakeman-engine.sh apps/MyApp

      # RuboCop, bundler-audit, Brakeman (the newest of each), tests and seeds, as the app's
      # own bin/ci runs them. Not part of `inline_forms create`: a new RuboCop
      # rule or advisory may turn this red, and that is only a notice here.
      - name: The generated app's bin/ci
        working-directory: apps/MyApp
        run: bin/ci
