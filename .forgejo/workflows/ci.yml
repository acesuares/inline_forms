# CI for Forgejo Actions (runner on dev02, jobs run in Docker containers).
#
# No Node: the job runs in the official ruby image (same Ruby as these gems) and
# uses only shell steps. actions/checkout and actions/cache are JavaScript and
# need node inside the container, so the checkouts are plain git and the gems
# are installed fresh each run.
#
# GitHub deliberately has NO workflows (.github/workflows was removed in
# 8.1.34): pushing to GitHub triggers nothing; CI runs only on Forgejo.
name: CI

# Push triggers on EVERY branch (stuff/prompt/workflow.md: "every commit runs
# through CI") — feature branches were silently skipping CI when this was
# `branches: [master]`.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.10
    steps:
      - name: Check out inline_forms
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git init -q inline_forms
          cd inline_forms
          git -c http.extraHeader="Authorization: basic $auth" fetch -q --depth 1 "$SERVER/$REPO.git" "$SHA"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      # The dev Gemfile points at the validation_hints sibling
      # (gem "validation_hints", path: "../validation_hints"). The job's
      # automatic token is scoped to this repo only and validation_hints is
      # private, so the repo secret VALIDATION_HINTS (a token with read
      # access to ace/validation_hints) authorizes the checkout.
      - name: Check out validation_hints
        env:
          TOKEN: ${{ secrets.VALIDATION_HINTS }}
          SERVER: ${{ github.server_url }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git init -q validation_hints
          cd validation_hints
          git -c http.extraHeader="Authorization: basic $auth" fetch -q --depth 1 "$SERVER/ace/validation_hints.git" HEAD
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Install gems
        working-directory: inline_forms
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Tests (unit + dummy-app integration harness)
        working-directory: inline_forms
        run: bundle exec rake test

      - name: RuboCop
        working-directory: inline_forms
        run: bundle exec rubocop

      - name: bundler-audit
        working-directory: inline_forms
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update
